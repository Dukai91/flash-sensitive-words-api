spring:
  application:
    name: sensitive-words
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sensitive_words;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
sanitization:
  max-message-length: ${SANITIZATION_MAX_MESSAGE_LENGTH:10000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  override-with-generic-response: false
