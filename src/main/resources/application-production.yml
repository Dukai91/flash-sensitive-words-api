spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          audiences: ${JWT_AUDIENCE}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
