name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, controller and real SQL Server integration tests
        run: ./mvnw -B -ntp clean verify -Pintegration
      - name: Build and start deployable stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify deployed HTTP contracts
        run: python3 scripts/smoke.py
      - name: Scan application dependencies and runtime image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: flash-sensitive-words:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln
          format: table
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down -v
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
